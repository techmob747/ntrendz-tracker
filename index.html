<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fff; }
        #searchBox { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f4f4f4; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <input type="text" id="searchBox" onkeyup="filterTable()" placeholder="Search Ticker (e.g. AAPL)...">

    <table id="stockTable">
        <thead><tr><th>Ticker</th><th>Volume</th><th>Price</th><th>Time</th></tr></thead>
        <tbody id="data-body"><tr><td colspan="4">Loading data...</td></tr></tbody>
    </table>

    <script>
        let allStocks = [];

        // 1. Fetch the JSON file
        fetch('stocks.json')
            .then(response => {
                if (!response.ok) throw new Error("Could not find stocks.json");
                return response.json();
            })
            .then(data => {
                allStocks = data;
                renderTable(allStocks.slice(0, 15));
            })
            .catch(err => {
                console.error(err);
                document.getElementById('data-body').innerHTML = "<tr><td colspan='4'>Error: Could not load data.</td></tr>";
            });

        // 2. Render function
        function renderTable(data) {
            const body = document.getElementById('data-body');
            body.innerHTML = data.map(row => 
                `<tr><td>${row.ticker}</td><td>${row.volume}</td><td>${row.price}</td><td>${row.time}</td></tr>`
            ).join("");
        }

        // 3. Search function
        function filterTable() {
            const input = document.getElementById("searchBox").value.toUpperCase();
            if (input === "") {
                renderTable(allStocks.slice(0, 15));
            } else {
                const filtered = allStocks.filter(s => s.ticker.toUpperCase().includes(input));
                renderTable(filtered);
            }
        }
    </script>
</body>
</html>
